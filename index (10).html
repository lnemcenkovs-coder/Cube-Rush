<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Cube Rush</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#070713;--fg:#fff;--ac:#4df;--th:200}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;text-align:center;background:radial-gradient(ellipse at 50% 20%,hsla(var(--th),70%,45%,.55),rgba(5,5,18,.95));overflow:auto}
.ov.hide{display:none}
h1{margin:0;font-size:clamp(36px,9vw,78px);letter-spacing:4px;font-weight:900;background:linear-gradient(90deg,hsl(var(--th),100%,65%),hsl(calc(var(--th) + 60),100%,70%),hsl(calc(var(--th) + 140),100%,70%));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px hsl(var(--th),100%,60%))}
.sub{opacity:.65;font-size:14px;margin-top:-8px}
.car{display:flex;align-items:center;gap:12px}
.card{width:min(300px,66vw);padding:20px;backdrop-filter:blur(8px);border-radius:18px;border:2px solid rgba(255,255,255,.35);box-shadow:0 0 30px var(--g);transition:.25s}
.card b{font-size:24px;display:block}.card .st{letter-spacing:3px;margin:6px 0;color:#fd4}
.bar{height:10px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden}.bar i{display:block;height:100%;background:#5f8;transition:.3s}
button{font:inherit;color:var(--fg);background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.4);border-radius:12px;padding:10px 18px;cursor:pointer;transition:.15s}
button:hover{background:rgba(255,255,255,.25);transform:translateY(-2px)}
.arr{width:46px;height:46px;border-radius:50%;padding:0;font-size:22px}
.play{font-size:26px;font-weight:800;padding:14px 56px;background:linear-gradient(hsl(var(--th),75%,50%),hsl(var(--th),80%,32%));border-color:hsl(var(--th),100%,80%);box-shadow:0 0 22px hsl(var(--th),90%,50%)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.sk{padding:3px;border-radius:10px}.sk.sel{border-color:#ff0;box-shadow:0 0 14px #ff0}
input[type=range]{width:220px;accent-color:hsl(var(--th),100%,60%)}
#hud{position:fixed;top:10px;left:10px;display:none;gap:8px}#hud button{padding:6px 12px}
.panel{background:rgba(10,12,40,.85);border:2px solid hsl(var(--th),100%,70%);border-radius:20px;padding:24px 34px;box-shadow:0 0 40px hsl(var(--th),100%,55%)}
.panel h2{margin:0 0 10px;font-size:clamp(28px,6vw,48px);color:#fd4;text-shadow:0 0 20px #f90}
.stats{display:flex;gap:22px;justify-content:center;margin:12px 0 18px}.stats div{font-size:13px;opacity:.8}.stats b{display:block;font-size:26px;color:#fff}
.dots{display:flex;gap:5px;justify-content:center;margin-top:12px}.dots i{width:8px;height:8px;border-radius:50%;opacity:.35;transition:.2s}.dots i.on{opacity:1;transform:scale(1.5)}
button:hover{border-color:hsl(var(--th),100%,75%)}
#splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .7s}
#splash svg{width:120px;height:120px;filter:drop-shadow(0 0 14px rgba(255,255,255,.55));animation:sp 2.4s ease-in-out infinite}
#splash b{font-size:clamp(26px,6vw,44px);letter-spacing:.5em;padding-left:.5em;font-weight:300;color:#fff;animation:fi 1s ease-out both}
#sbarw{width:min(260px,60vw);height:3px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
#sbar{height:100%;width:0;background:#fff}
@keyframes sp{0%,100%{transform:scale(.92) rotate(0)}50%{transform:scale(1.05) rotate(6deg)}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.mhead{text-align:center}.mhead h1{animation:ttl 3s ease-in-out infinite}
@keyframes ttl{0%,100%{filter:drop-shadow(0 0 14px hsl(var(--th),100%,60%))}50%{filter:drop-shadow(0 0 30px hsl(var(--th),100%,65%))}}
.mwrap{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;width:min(940px,96vw);align-items:stretch}
@media(max-width:780px){.mwrap{grid-template-columns:1fr}}
.mpanel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:18px;backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;box-shadow:0 8px 40px rgba(0,0,0,.35)}
.ptitle{letter-spacing:6px;font-weight:800;font-size:13px;opacity:.7}
#gp{border-radius:18px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15)}
.card canvas{width:100%;height:auto;border-radius:12px;margin-bottom:8px;display:block}
.card .cn{margin-top:2px}.card b{font-size:26px}
.play{animation:pls 2s ease-in-out infinite}
@keyframes pls{0%,100%{box-shadow:0 0 18px hsl(var(--th),90%,50%)}50%{box-shadow:0 0 38px hsl(var(--th),100%,60%)}}
.mini{position:fixed;right:14px;top:14px;width:44px;height:44px;padding:0;border-radius:50%;font-size:20px;z-index:3}
.mfoot{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;width:min(940px,96vw)}
.vcard{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 20px;border-radius:18px;border-color:#5ff;background:linear-gradient(120deg,rgba(30,60,140,.6),rgba(80,20,120,.6));box-shadow:0 0 20px rgba(80,255,255,.3)}
.vcard .vi{font-size:30px}.vcard b{display:block;font-size:17px;letter-spacing:1px}.vcard small{opacity:.75;font-size:12px}
.mstats{display:flex;gap:22px}.mstats div{font-size:12px;opacity:.85;text-align:center}.mstats b{display:block;font-size:22px;color:#fff}

/* ---- one-page Cube Rush menu ---- */
#menu{overflow:hidden;justify-content:space-evenly;gap:0;padding:2vh 14px;height:100dvh;background:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.45))}
#menu .mhead{text-align:center}
#menu h1{font-size:clamp(34px,9.5vh,84px);letter-spacing:3px;font-style:italic;background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--fg);-webkit-text-stroke:clamp(2px,.6vh,5px) #0a0f2e;paint-order:stroke fill;text-shadow:0 .5vh 0 hsl(var(--th),75%,32%),0 0 28px hsl(var(--th),100%,60%);filter:none;animation:none;margin:0}
#menu .mstats{display:flex;gap:18px;justify-content:center;margin-top:.8vh}#menu .mstats div{font-size:11px;opacity:.9;text-transform:uppercase;letter-spacing:1px}#menu .mstats b{display:inline;font-size:14px;margin-right:5px;color:#fd4}
#menu .stage{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,22px);width:100%}
#menu .arr{width:clamp(42px,7vh,60px);height:clamp(42px,7vh,60px);font-size:clamp(22px,4vh,32px);flex:none;background:linear-gradient(#3d6,#1a8);border-color:#cfc;box-shadow:0 4px 0 #0a5}
#menu .card{width:min(440px,66vw);padding:1.4vh 18px;border-width:3px;border-radius:20px;text-align:center}
#menu .card canvas{width:100%;height:min(14vh,110px);object-fit:cover;border-radius:12px;margin-bottom:.8vh}
#menu .card b{font-size:clamp(20px,4vh,30px);font-style:italic}#menu .card .st{margin:.3vh 0}#menu .card small{font-size:12px}
#menu .card .dots{margin-top:.8vh}
#menu .play{width:clamp(88px,17vh,136px);height:clamp(88px,17vh,136px);border-radius:50%;padding:0 0 0 .6vh;font-size:clamp(40px,8vh,64px);line-height:1;background:linear-gradient(hsl(var(--th),85%,58%),hsl(var(--th),90%,36%));border:4px solid #fff;box-shadow:0 .8vh 0 hsl(var(--th),80%,24%),0 0 36px hsl(var(--th),100%,60%);animation:pls 1.8s ease-in-out infinite}
#menu .play:hover{transform:scale(1.08)}
#menu .dock{display:flex;gap:clamp(14px,3vw,34px);justify-content:center}
#menu .ib{width:clamp(70px,11vh,92px);height:clamp(70px,11vh,92px);border-radius:22px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,.06));border:3px solid rgba(255,255,255,.7);box-shadow:0 .5vh 0 rgba(0,0,0,.4)}
#menu .ib span{font-size:clamp(24px,4.4vh,36px);line-height:1}#menu .ib small{font-size:11px;font-weight:700;letter-spacing:.5px}
#garage{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,10,.78);z-index:6}#garage.open{display:flex}
.gpanel{background:linear-gradient(160deg,rgba(30,40,100,.95),rgba(10,10,40,.97));border:3px solid hsl(var(--th),100%,70%);border-radius:24px;padding:18px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:94vw;max-height:94dvh;box-shadow:0 0 40px hsl(var(--th),100%,50%)}
#gclose{background:linear-gradient(#3d6,#1a8);border-color:#cfc;font-weight:800;padding:8px 26px}
@media(max-height:600px){#menu .mstats{display:none}#menu .card .dots,#menu .card small:last-of-type{display:none}}

/* ---- menu v3 (no picture) ---- */
#menu .floaters{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#menu .floaters span{position:absolute;bottom:-60px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);border-radius:6px;animation:flt linear infinite}
@keyframes flt{from{transform:translateY(0) rotate(0)}to{transform:translateY(-115vh) rotate(260deg)}}
#menu .mhead,#menu .stage,#menu .play,#menu .dock{position:relative;z-index:1}
#menu .ttl{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,26px)}
#menu .tcube{width:clamp(22px,5vh,40px);height:clamp(22px,5vh,40px);border:3px solid #fff;background:linear-gradient(135deg,hsl(var(--th),90%,60%),hsl(var(--th),90%,35%));border-radius:6px;box-shadow:0 0 18px hsl(var(--th),100%,60%);animation:spn 3.2s ease-in-out infinite}
#menu .tcube.r{animation-direction:reverse}
@keyframes spn{0%,35%{transform:rotate(0)}65%,100%{transform:rotate(180deg)}}
#menu .card{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(10px,2vw,22px);text-align:left;width:min(580px,72vw);padding:clamp(10px,2vh,22px) clamp(14px,2vw,26px);box-shadow:0 0 34px var(--g),inset 0 0 0 2px rgba(255,255,255,.25)}
#menu .card::before{content:'';position:absolute;top:0;bottom:0;left:-56px;right:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.08) 0 14px,transparent 14px 28px);animation:stp 2.4s linear infinite;pointer-events:none}
@keyframes stp{to{transform:translateX(56px)}}
#menu .card>*{position:relative}
#menu .cnum{font-size:clamp(46px,11vh,92px);font-weight:900;font-style:italic;line-height:1;color:#fff;text-shadow:0 .7vh 0 rgba(0,0,0,.35),0 0 24px rgba(255,255,255,.4)}
#menu .cbody b{font-size:clamp(20px,4.2vh,34px);display:block;font-style:italic;letter-spacing:.5px}
#menu .cbody small{opacity:.8;letter-spacing:2px;font-size:11px}
#menu .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:.6vh}#menu .chips span{font-size:11px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:2px 9px;white-space:nowrap}
#menu .ring{position:relative;width:clamp(54px,10vh,80px);height:clamp(54px,10vh,80px)}#menu .ring svg{width:100%;height:100%}
#menu .ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(12px,2vh,16px)}
#menu .card .dots{grid-column:1/-1;justify-content:center;margin-top:0}
#menu .play::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:3px solid hsl(var(--th),100%,70%);animation:rpl 1.8s ease-out infinite;pointer-events:none}
#menu .play{position:relative}
@keyframes rpl{from{transform:scale(1);opacity:.8}to{transform:scale(1.45);opacity:0}}
@media(max-width:560px){#menu .card{grid-template-columns:auto 1fr}#menu .ring{display:none}}
@media(max-height:600px){#menu .chips{display:none}}

.gpanel{width:min(580px,94vw);overflow:auto}
#gp{width:100%;height:auto;border-radius:16px;border:1px solid rgba(255,255,255,.2)}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.gtabs button{padding:6px 14px;font-weight:700}.gtabs button.sel,.gopts button.sel,#cstyles button.sel{border-color:#ff0;box-shadow:0 0 12px #ff0}
#gbody{width:100%;min-height:150px;max-height:32vh;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ggrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.ggrid button{padding:3px;border-radius:10px}
.gopts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.gopts button.sk{padding:3px}
#colpanel .row{margin:7px 0;justify-content:center}#colpanel label{font-size:13px;display:flex;align-items:center;gap:4px}

#settings{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,10,.78);z-index:7}#settings.open{display:flex}
.srow{display:flex;align-items:center;gap:10px;width:100%;justify-content:space-between}.srow label{min-width:104px;text-align:left;font-weight:700;font-size:14px}.srow input[type=range]{flex:1}.srow span{min-width:42px;text-align:right;font-size:13px}
#tcols{display:flex;gap:6px;flex-wrap:wrap;flex:1}#tcols .sw{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.5)}#tcols .sw.sel{border-color:#ff0;box-shadow:0 0 10px #ff0}
#codeIn{flex:1;padding:8px 10px;border-radius:10px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);color:var(--fg);font:inherit;letter-spacing:3px;text-align:center}#codeMsg{min-height:20px;font-weight:700}

/* ================= ANIMATION PASS ================= */
button{transition:transform .2s cubic-bezier(.2,1.6,.4,1),box-shadow .2s,background .2s,border-color .2s}
button:active{transform:scale(.93)!important}
@keyframes popIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes dropIn{from{opacity:0;transform:translateY(-40px) scale(.9)}to{opacity:1;transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes wv{0%,100%{transform:translateY(0)}50%{transform:translateY(-.09em)}}
@keyframes sweep{from{transform:translateX(-70%)}to{transform:translateX(70%)}}
@keyframes twk{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.5)}}
@keyframes cardL{from{opacity:0;transform:translateX(-70px) scale(.95)}to{opacity:1;transform:none}}
@keyframes cardR{from{opacity:0;transform:translateX(70px) scale(.95)}to{opacity:1;transform:none}}
@keyframes numPop{0%{transform:scale(.4) rotate(-8deg);opacity:0}70%{transform:scale(1.15) rotate(2deg)}100%{transform:none;opacity:1}}
@keyframes cfall{0%{opacity:1}to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
@keyframes shut{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@keyframes glowp{0%,100%{filter:drop-shadow(0 0 14px rgba(120,160,255,.55))}50%{filter:drop-shadow(0 0 32px rgba(190,140,255,.95))}}
#wipe{position:fixed;inset:0;z-index:9000;pointer-events:none;display:flex}
#wipe i{flex:1;background:linear-gradient(#0a1030,#2a0a55);transform:scaleY(0)}
#wipe.go i{animation:shut .64s cubic-bezier(.7,0,.3,1) both}
#wipe.go i:nth-child(2){animation-delay:.05s}#wipe.go i:nth-child(3){animation-delay:.1s}#wipe.go i:nth-child(4){animation-delay:.15s}#wipe.go i:nth-child(5){animation-delay:.2s}
#menu::before{content:'';position:absolute;inset:-20% -30%;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.09) 50%,transparent 58%);animation:sweep 7s linear infinite;pointer-events:none}
#menu .tw{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:twk 2.4s ease-in-out infinite}
#menu .mhead{animation:dropIn .8s cubic-bezier(.2,1.3,.4,1) both}
#menu .stage{animation:riseIn .7s .15s cubic-bezier(.2,1,.3,1) both}
#menu .play{animation:popIn .65s .3s cubic-bezier(.2,1.7,.4,1) both,pls 1.8s ease-in-out .95s infinite}
#menu .dock{animation:riseIn .7s .45s cubic-bezier(.2,1,.3,1) both}
#menu h1 span{display:inline-block;animation:wv 2.6s ease-in-out infinite}
#menu .card.sL{animation:cardL .45s cubic-bezier(.2,.9,.3,1.2)}#menu .card.sR{animation:cardR .45s cubic-bezier(.2,.9,.3,1.2)}
#menu .cnum{animation:numPop .55s cubic-bezier(.2,1.4,.4,1)}
#menu .arr:hover{transform:scale(1.15)}#menu .arr:active{transform:scale(.9)!important}
#menu .ib:hover{transform:translateY(-6px) rotate(-3deg) scale(1.06)}
#menu .ib span{display:inline-block;animation:bob 3s ease-in-out infinite}#menu .ib:nth-child(2) span{animation-delay:-1.4s}
#menu .play:hover{transform:scale(1.1) rotate(4deg)}
#mute{transition:transform .5s cubic-bezier(.2,1.5,.4,1)}#mute:hover{transform:rotate(120deg) scale(1.12)}
#garage.open,#settings.open{animation:fade .25s}
#garage.open .gpanel,#settings.open .gpanel{animation:pop .38s cubic-bezier(.2,1.4,.4,1)}
#gbody>*{animation:fade .3s}
.ggrid button{animation:popIn .35s cubic-bezier(.2,1.6,.4,1) both}.ggrid button:nth-child(1){animation-delay:14ms}.ggrid button:nth-child(2){animation-delay:28ms}.ggrid button:nth-child(3){animation-delay:42ms}.ggrid button:nth-child(4){animation-delay:56ms}.ggrid button:nth-child(5){animation-delay:70ms}.ggrid button:nth-child(6){animation-delay:84ms}.ggrid button:nth-child(7){animation-delay:98ms}.ggrid button:nth-child(8){animation-delay:112ms}.ggrid button:nth-child(9){animation-delay:126ms}.ggrid button:nth-child(10){animation-delay:140ms}.ggrid button:nth-child(11){animation-delay:154ms}.ggrid button:nth-child(12){animation-delay:168ms}.ggrid button:nth-child(13){animation-delay:182ms}.ggrid button:nth-child(14){animation-delay:196ms}.ggrid button:nth-child(15){animation-delay:210ms}.ggrid button:nth-child(16){animation-delay:224ms}.ggrid button:nth-child(17){animation-delay:238ms}.ggrid button:nth-child(18){animation-delay:252ms}.ggrid button:nth-child(19){animation-delay:266ms}.ggrid button:nth-child(20){animation-delay:280ms}.ggrid button:nth-child(21){animation-delay:294ms}.ggrid button:nth-child(22){animation-delay:308ms}.ggrid button:nth-child(23){animation-delay:322ms}.ggrid button:nth-child(24){animation-delay:336ms}
.ggrid button:hover,.gopts button.sk:hover{transform:translateY(-4px) scale(1.12)}
#end.ov:not(.hide) .panel{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
#end .stats div{animation:riseIn .5s both}#end .stats div:nth-child(2){animation-delay:.12s}#end .stats div:nth-child(3){animation-delay:.24s}
.cf{position:absolute;top:-24px;height:14px;border-radius:2px;pointer-events:none;animation:cfall 2.4s ease-in forwards;z-index:3}
#splash b span{display:inline-block;animation:wv 1.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
<div id="splash"><svg viewBox="0 0 100 100"><g fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M50 8L88 29V71L50 92L12 71V29Z"/><path d="M50 50L12 29M50 50L88 29M50 50V92"/></g></svg><b>CUBE RUSH</b><div id="sbarw"><div id="sbar"></div></div></div>
<div id="wipe"><i></i><i></i><i></i><i></i><i></i></div>
<canvas id="c"></canvas>

let bot=false,bc=0,on=false,W=1,H=1,U=1,hold=false,raf=0,last=0,acc=0,st=null,mode='menu',cur=-1,flash=0,shake=0,parts=[],t=0,att=0,t0=0;

function resize(){const d=Math.min(devicePixelRatio||1,2);W=cv2.width=Math.max(1,wv.clientWidth*d|0);H=cv2.height=Math.max(1,wv.clientHeight*d|0);U=H/HH}
function tri(x){let f=x/SP;f-=Math.floor(f);return 1-Math.abs(2*f-1)}
function newState(L){const s={L,x:0,y:HH/2,dist:0,dead:0,cd:0,cdT:1,go:0,kb:0,cn:[HH/2],gn:[L.gap],c:HH/2,g:L.gap,left:14,prev:'flat',trail:[],lp:-1,ph:false,obs:[],gt:[],sw:[],pt:[],pi:0,sm:1,sc:1,t:0,rev:null,alt:1,won:0,nb:false};

if(st.rev&&(k>=st.rev.k||fin)){st.pt.push({x:k,k:st.rev.kind});st.rev=null}

if(st.left<=0){const ty=pick();st.prev=ty;const A=1.5+rnd()*1.6;st.sec={ty,k0:k,A,w:Math.min(.5,.8/A)*(.7+rnd()*.5),ph:rnd()*6.28,n:3+(rnd()*3|0),y:HH/2+(rnd()-.5)*5,dy:rnd()<.5?1:-1,tg:HH/2,side:rnd()<.5?1:-1,nx:0,mv:rnd()<.5};if(ty=='razor')st.sec.n=2+(rnd()*2|0);

if(!st.rev&&d>60&&rnd()<(L.pp||0)){const kind=['f','s','m'][rnd()*3|0];st.pt.push({x:k+2,k:kind});st.rev={k:k+st.left,kind:kind=='m'?'b':'n'}}}
st.left--;const s=st.sec,j=k-s.k0;
const big=fin||s.ty=='arena'||s.ty=='gates'||s.ty=='saws'||s.ty=='slalom'||s.ty=='field';
let gt=Math.max(L.min,L.gap-d*L.sh);if(s.ty=='squeeze')gt=Math.max(L.min,gt*.85);if(s.ty=='open')gt*=1.45;if(s.ty=='razor')gt=Math.max(L.min,gt*.9);if(s.ty=='funnel')gt=L.min+(gt-L.min)*(.5+.5*Math.cos(j*.22));if(big)gt=HH-.4;
st.g+=Math.max(-.3,Math.min(.3,gt-st.g));const g=st.g;let lo=g/2+.3,hi=HH-g/2-.3;if(big||hi<lo+.5){lo=2.4;hi=HH-2.4}
let tg=st.c;

else if(s.ty=='zig')tg=(((j/s.n)|0)%2)?lo:hi;
else if(s.ty=='flat')tg=s.y;
else if(s.ty=='drift'){if(j%4==0)s.tg=lo+rnd()*(hi-lo);tg=s.tg}
else if(s.ty=='stair'){if(j>=s.nx){s.nx=j+3+(rnd()*4|0);s.y+=s.dy*(1+rnd()*2.5);if(s.y<lo||s.y>hi){s.dy=-s.dy;s.y=Math.max(lo,Math.min(hi,s.y))}}tg=s.y}
else if(s.ty=='squeeze')tg=st.c+Math.sin(j*.5)*.5;
else if(s.ty=='arena'){if(j%5==0)s.tg=lo+rnd()*(hi-lo);tg=s.tg}
else if(s.ty=='gates'){if(j%9==0)s.tg=lo+rnd()*(hi-lo);tg=s.tg}
else if(s.ty=='saws')tg=HH/2+Math.sin(j*.2+s.ph)*2.4;
else if(s.ty=='razor')tg=(((j/s.n)|0)%2)?lo:hi;
else if(s.ty=='slalom')tg=HH/2+Math.sin(j*.15+s.ph)*1.2;
else if(s.ty=='field'){if(j%6==0)s.tg=lo+rnd()*(hi-lo);tg=s.tg}
else if(s.ty=='funnel')tg=HH/2+Math.sin(j*.3+s.ph)*1.8;
else tg=HH/2+Math.sin(j*.25+s.ph)*1.2;
const sm=s.ty=='razor'?1:.85;st.c+=Math.max(-sm*NS,Math.min(sm*NS,tg-st.c));st.c=Math.max(lo,Math.min(hi,st.c));

if(s.ty=='arena'&&j%5==2){const r=.7+rnd()*.4;s.side=-s.side;st.obs.push({x:X,y:st.c+s.side*(r+.55+rnd()*.6),r});if(rnd()<.4){const r2=.6+rnd()*.3;st.obs.push({x:X+2,y:st.c-s.side*(r2+.6+rnd()*.5),r:r2})}}
if(s.ty=='gates'&&j%9==4)st.gt.push({x:X,hy:st.c,hs:Math.max(3.7,L.gap*.6+rnd()*.5),w:1.3,amp:s.mv?.8+rnd()*.8:0,ph:rnd()*6.28,sp:1.6+rnd()*1.2});
if(s.ty=='slalom'&&j%5==2){s.side=-s.side;const m=1.5+rnd()*.4;if(s.side<0){const tip=st.c-m;st.gt.push({x:X,hy:(tip+HH+14)/2,hs:HH+14-tip,w:1.3,amp:0,ph:0,sp:0})}else{const e=st.c+m;st.gt.push({x:X,hy:(e-14)/2,hs:e+14,w:1.3,amp:0,ph:0,sp:0})}}

{const bn=S.burst==2?28:34;for(let i=0;i<bn;i++){const a=i/bn*6.283;parts.push({x:st.x,y:st.y,vx:S.burst==2?Math.cos(a)*10:(rnd()-.5)*15,vy:S.burst==2?Math.sin(a)*10:(rnd()-.5)*15,l:1,c:S.burst==1?(rnd()*360|0):undefined})}}}

function botDecide(){const rr=.12*st.sc,v=speed(),dt=1/20,sub=3,K=32,H=20,x0=st.x-2,x1=st.x+26;
const ob=st.obs.filter(o=>o.x>x0&&o.x<x1),gt=st.gt.filter(o=>o.x>x0&&o.x<x1),sw=st.sw.filter(o=>o.x>x0&&o.x<x1);

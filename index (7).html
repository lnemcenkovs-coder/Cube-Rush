let last=performance.now(),acc=0;
function loop(n){if(window.waveOn){last=n;requestAnimationFrame(loop);return}const d=Math.min(.05,(n-last)/1000);last=n;t+=d;shake=Math.max(0,shake-d);flash=Math.max(0,flash-d*2);

<script>
(function(){

const LV=[
{n:'Neon Dawn',len:700,hue:190,gap:7.6,sh:.0006,min:5.6,v0:9,v1:11,pp:0,mix:{wave:3,drift:2,flat:2,arena:2,stair:0,zig:0,squeeze:0,open:1,gates:0,saws:0}},
{n:'Pulse Tunnel',len:900,hue:285,gap:7.2,sh:.0008,min:5.2,v0:9.5,v1:12,pp:.12,mix:{wave:2,drift:2,flat:1,arena:2,stair:2,zig:0,squeeze:1,open:2,gates:2,saws:0}},
{n:'Razor Alley',len:1100,hue:335,gap:6.6,sh:.001,min:4.8,v0:10,v1:12.5,pp:.18,mix:{wave:1,drift:2,flat:1,arena:2,stair:2,zig:3,squeeze:1,open:2,gates:2,saws:2}},
{n:'Cavern Run',len:1300,hue:150,gap:6.8,sh:.0009,min:4.8,v0:10.5,v1:13,pp:.2,mix:{wave:1,drift:1,flat:1,arena:3,stair:1,zig:1,squeeze:2,open:3,gates:2,saws:3}},
{n:'Glass Storm',len:1500,hue:220,gap:6.4,sh:.001,min:4.8,v0:11,v1:13.5,pp:.25,mix:{wave:1,drift:1,flat:0,arena:2,stair:2,zig:3,squeeze:2,open:2,gates:3,saws:3}},
{n:'Ember Gate',len:1700,hue:20,gap:6.1,sh:.001,min:4.7,v0:11.5,v1:14,pp:.28,mix:{wave:1,drift:1,flat:0,arena:2,stair:2,zig:3,squeeze:3,open:2,gates:4,saws:3}},
{n:'Void Needle',len:2000,hue:260,gap:5.8,sh:.001,min:4.6,v0:12,v1:14.5,pp:.3,mix:{wave:1,drift:1,flat:0,arena:3,stair:2,zig:4,squeeze:3,open:3,gates:4,saws:4}},
{n:'Final Spiral',len:2400,hue:310,gap:5.6,sh:.001,min:4.5,v0:12.5,v1:15,pp:.35,mix:{wave:1,drift:1,flat:0,arena:3,stair:2,zig:4,squeeze:4,open:3,gates:4,saws:4}}];
const UN={n:'Unlimited',len:Infinity,span:2500,hue:null,gap:7.6,sh:.0011,min:4.4,v0:9,v1:15,pp:.2,mixf:d=>({wave:3,drift:3,flat:d<500?2:1,arena:d>150?2:0,stair:d>300?2:0,zig:d>600?3:0,squeeze:d>900?2:0,open:d>400?2:0,gates:d>500?3:0,saws:d>700?3:0})};
const SK=[[[.6,0],[-.4,-.34],[-.2,0],[-.4,.34]],[[.65,0],[.05,-.38],[.05,-.14],[-.5,-.14],[-.5,.14],[.05,.14],[.05,.38]],[[.55,0],[0,-.4],[-.45,0],[0,.4]],[[.55,0],[0,-.42],[-.28,-.42],[.2,0],[-.28,.42],[0,.42]],[[.65,0],[-.1,-.45],[-.45,-.3],[-.3,0],[-.45,.3],[-.1,.45]],[[.7,0],[-.05,-.22],[-.5,-.4],[-.32,0],[-.5,.4],[-.05,.22]],[[.6,0],[-.1,-.36],[-.5,0],[-.1,.36]],[[.62,0],[.1,-.1],[0,-.45],[-.1,-.1],[-.45,0],[-.1,.1],[0,.45],[.1,.1]]];
let on=false,W=1,H=1,U=1,hold=false,raf=0,last=0,acc=0,st=null,mode='menu',cur=-1,flash=0,shake=0,parts=[],t=0,att=0,t0=0;
let S={skin:0,hue:180,prog:1,best:0,lv:[]};
try{const j=JSON.parse(localStorage.getItem('vw2')||'null');if(j)S=Object.assign(S,j);if(!S.best)S.best=+localStorage.getItem('vw_best')||0}catch(e){}
S.lv=LV.map((_,i)=>(S.lv&&S.lv[i])||0);
const save=()=>{try{localStorage.setItem('vw2',JSON.stringify(S))}catch(e){}};
function resize(){const d=Math.min(devicePixelRatio||1,2);W=cv2.width=Math.max(1,wv.clientWidth*d|0);H=cv2.height=Math.max(1,wv.clientHeight*d|0);U=H/HH}
function tri(x){let f=x/SP;f-=Math.floor(f);return 1-Math.abs(2*f-1)}
function newState(L){const s={L,x:0,y:HH/2,dist:0,dead:0,cd:0,cdT:1,go:0,kb:0,cn:[HH/2],gn:[L.gap],c:HH/2,g:L.gap,left:14,prev:'flat',trail:[],lp:-1,ph:false,obs:[],gt:[],sw:[],pt:[],pi:0,sm:1,sc:1,t:0,rev:null,alt:1,won:0,nb:false};
s.sec={ty:'flat',k0:0,y:HH/2,A:2,w:.3,ph:0,n:4,dy:1,tg:HH/2,side:1};return s}
function pick(){const L=st.L,m=L.mixf?L.mixf(st.cn.length+st.kb):L.mix;let tot=0;for(const k in m)if(k!=st.prev)tot+=m[k];let r=rnd()*tot;for(const k in m){if(k==st.prev)continue;r-=m[k];if(r<=0)return k}return'wave'}
function gnode(){const L=st.L,k=st.cn.length+st.kb,d=k*NS;
if(st.rev&&k>=st.rev.k){st.pt.push({x:k,k:st.rev.kind});st.rev=null}
if(st.left<=0){const ty=pick();st.prev=ty;const A=1.5+rnd()*1.6;st.sec={ty,k0:k,A,w:Math.min(.5,.8/A)*(.7+rnd()*.5),ph:rnd()*6.28,n:3+(rnd()*3|0),y:HH/2+(rnd()-.5)*5,dy:rnd()<.5?1:-1,tg:HH/2,side:rnd()<.5?1:-1};
st.left={wave:22,zig:20,flat:10,drift:20,stair:18,squeeze:12,open:22,arena:26,gates:38,saws:34}[ty]+(rnd()*8|0);
if(!st.rev&&d>60&&rnd()<(L.pp||0)){const kind=['f','s','m'][rnd()*3|0];st.pt.push({x:k+2,k:kind});st.rev={k:k+st.left,kind:kind=='m'?'b':'n'}}}
st.left--;const s=st.sec,j=k-s.k0;
const big=s.ty=='arena'||s.ty=='gates'||s.ty=='saws';
let gt=Math.max(L.min,L.gap-d*L.sh);if(s.ty=='squeeze')gt=Math.max(L.min,gt*.85);if(s.ty=='open')gt*=1.45;if(big)gt=HH-.4;
st.g+=Math.max(-.3,Math.min(.3,gt-st.g));const g=st.g;let lo=g/2+.3,hi=HH-g/2-.3;if(big||hi<lo+.5){lo=2.4;hi=HH-2.4}
let tg=st.c;
if(s.ty=='wave')tg=HH/2+s.A*Math.sin(s.w*j+s.ph);
else if(s.ty=='zig')tg=(((j/s.n)|0)%2)?lo:hi;
else if(s.ty=='flat')tg=s.y;
else if(s.ty=='drift'){if(j%4==0)s.tg=lo+rnd()*(hi-lo);tg=s.tg}
else if(s.ty=='stair'){if(j%4==0){s.y+=s.dy*1.6;if(s.y<lo||s.y>hi){s.dy=-s.dy;s.y=Math.max(lo,Math.min(hi,s.y))}}tg=s.y}
else if(s.ty=='squeeze')tg=st.c+Math.sin(j*.5)*.5;
else if(s.ty=='arena'){if(j%5==0)s.tg=lo+rnd()*(hi-lo);tg=s.tg}
else if(s.ty=='gates'){if(j%9==0)s.tg=lo+rnd()*(hi-lo);tg=s.tg}
else if(s.ty=='saws')tg=HH/2+Math.sin(j*.2+s.ph)*2.4;
else tg=HH/2+Math.sin(j*.25+s.ph)*1.2;
st.c+=Math.max(-.85*NS,Math.min(.85*NS,tg-st.c));st.c=Math.max(lo,Math.min(hi,st.c));
st.cn.push(st.c);st.gn.push(g);
const X=k*NS;
if(s.ty=='open'&&j%6==3){st.alt=-st.alt;st.obs.push({x:X,y:st.c+st.alt*g*.17,r:.65+rnd()*.25})}
if(s.ty=='arena'&&j%5==2){const r=.7+rnd()*.4;s.side=-s.side;st.obs.push({x:X,y:st.c+s.side*(r+.55+rnd()*.6),r});if(rnd()<.4){const r2=.6+rnd()*.3;st.obs.push({x:X+2,y:st.c-s.side*(r2+.6+rnd()*.5),r:r2})}}
if(s.ty=='gates'&&j%9==4)st.gt.push({x:X,hy:st.c,hs:Math.max(3.7,L.gap*.6+rnd()*.5),w:1.3});
if(s.ty=='saws'&&j%7==3)st.sw.push({x:X,y:st.c+(rnd()-.5)*1.2,amp:1.4+rnd()*.8,ph:rnd()*6.28,sp:2.4+rnd()*1.4,r:.6})}
function ext(){while((st.cn.length+st.kb)*NS<st.x+90)gnode()}
function trim(){if(st.cn.length>500&&st.x/NS-st.kb>300){st.cn.splice(0,150);st.gn.splice(0,150);st.kb+=150}if(st.obs.length>40)st.obs=st.obs.filter(o=>o.x>st.x-30);if(st.gt.length>20)st.gt=st.gt.filter(o=>o.x>st.x-30);if(st.sw.length>20)st.sw=st.sw.filter(o=>o.x>st.x-30)}
function at(x){const f=Math.max(0,x/NS-st.kb),i=f|0,u=f-i;return[st.cn[i]*(1-u)+st.cn[i+1]*u,st.gn[i]*(1-u)+st.gn[i+1]*u]}
function speed(){const L=st.L;return(L.v0+(L.v1-L.v0)*Math.min(1,st.x/(L.span||L.len)))*st.sm}
function die(){st.dead=.9;flash=.5;shake=.4;
if(st.L===UN){if(st.dist>S.best)S.best=st.dist}else{const p=Math.min(99,st.x/st.L.len*100|0);if(p>S.lv[cur])S.lv[cur]=p}save();
for(let i=0;i<30;i++)parts.push({x:st.x,y:st.y,vx:(rnd()-.5)*15,vy:(rnd()-.5)*15,l:1})}
function win(){st.won=1;S.lv[cur]=100;S.prog=Math.max(S.prog,Math.min(LV.length,cur+2));save();
$('wln').textContent=LV[cur].n;$('wsa').textContent=att;$('wst').textContent=((performance.now()-t0)/1000).toFixed(1)+'s';
$('wnx').style.display=cur<LV.length-1?'':'none';setTimeout(()=>{if(st.won)show('wwin')},900)}
function step(dt){const v=speed();st.t+=dt;st.x+=v*dt;st.y+=(hold?-v:v)*dt;st.dist=st.x;ext();trim();
while(st.pi<st.pt.length&&st.x>=st.pt[st.pi].x){const k=st.pt[st.pi++].k;if(k=='f')st.sm=1.3;else if(k=='s')st.sm=.8;else if(k=='n')st.sm=1;else if(k=='m')st.sc=.6;else st.sc=1}
const rr=.12*st.sc,q=at(st.x),top=q[0]-q[1]/2+DEP*tri(st.x),bot=q[0]+q[1]/2-DEP*tri(st.x+SP/2);
if(st.y-rr<top||st.y+rr>bot||st.y<-.5||st.y>HH+.5){die();return}
for(const o of st.obs){const dx=Math.abs(o.x-st.x);if(dx<2&&dx+Math.abs(o.y-st.y)<o.r+rr+.02){die();return}}
for(const g of st.gt){if(Math.abs(g.x-st.x)<g.w/2+rr&&(st.y-rr<g.hy-g.hs/2+.45||st.y+rr>g.hy+g.hs/2-.45)){die();return}}
for(const w of st.sw){if(Math.abs(w.x-st.x)<w.r+rr+.3){const sy=w.y+w.amp*Math.sin(w.sp*st.t+w.ph),dx=w.x-st.x,dy=sy-st.y;if(dx*dx+dy*dy<(w.r+rr)*(w.r+rr)){die();return}}}
if(st.x-st.lp>.1||hold!==st.ph){st.lp=st.x;st.ph=hold;st.trail.push(st.x,st.y);if(st.trail.length>260)st.trail.splice(0,2)}
if(st.L!==UN&&st.x>=st.L.len){win();return}}
function drawArrow(g,x,y,ang,k,h,sz){g.save();g.translate(x,y);g.rotate(ang);const p=SK[k],gr=g.createLinearGradient(-sz*.5,0,sz*.65,0);gr.addColorStop(0,'hsl('+h+',90%,45%)');gr.addColorStop(1,'#fff');
g.beginPath();g.moveTo(p[0][0]*sz,p[0][1]*sz);for(let i=1;i<p.length;i++)g.lineTo(p[i][0]*sz,p[i][1]*sz);g.closePath();g.fillStyle=gr;g.fill();g.lineJoin='round';g.strokeStyle='hsl('+h+',100%,70%)';g.lineWidth=sz*.07;g.stroke();g.restore()}
function walls(h,cam,sx,sy){const hs=SP/2,x0=Math.floor(cam/SP)*SP-SP,x1=cam+W/U+SP,lit='hsl('+(h+170)%360+',100%,64%)',drk='hsl('+(h+170)%360+',90%,34%)';
for(let w=0;w<2;w++){const tp=!w,Y=q=>tp?q[0]-q[1]/2:q[0]+q[1]/2,E=tp?-3:HH+3;
c.beginPath();let f=true;for(let x=x0;x<=x1;x+=hs){const y=Y(at(x));if(f){c.moveTo(sx(x),sy(E));f=false}c.lineTo(sx(x),sy(y))}c.lineTo(sx(x1),sy(E));c.closePath();c.fillStyle='hsl('+(h+30)%360+',45%,8%)';c.fill();
for(let x=x0;x<x1;x+=SP){const xl=tp?x:x-hs,xm=xl+hs,xr=xl+SP,yl=Y(at(xl)),yb=Y(at(xm)),yr=Y(at(xr)),ym=yb+(tp?DEP:-DEP);
c.fillStyle=lit;c.beginPath();c.moveTo(sx(xl),sy(yl));c.lineTo(sx(xm),sy(ym));c.lineTo(sx(xm),sy(yb));c.closePath();c.fill();
c.fillStyle=drk;c.beginPath();c.moveTo(sx(xm),sy(yb));c.lineTo(sx(xm),sy(ym));c.lineTo(sx(xr),sy(yr));c.closePath();c.fill();
c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=Math.max(1,U*.03);c.beginPath();c.moveTo(sx(xl),sy(yl));c.lineTo(sx(xm),sy(ym));c.lineTo(sx(xr),sy(yr));c.stroke()}}}
function drawExtras(h,cam,sx,sy){const lit='hsl('+(h+170)%360+',100%,64%)',drk='hsl('+(h+170)%360+',90%,34%)',body='hsl('+(h+30)%360+',45%,9%)';
for(const g of st.gt){const X=sx(g.x-g.w/2),w=g.w*U;if(X>W||X+w<0)continue;const ht=sy(g.hy-g.hs/2),hb=sy(g.hy+g.hs/2),sd=U*.45;
c.fillStyle=body;c.fillRect(X,-U*2,w,ht+U*2);c.fillRect(X,hb,w,H-hb+U*2);
for(let i=0;i<2;i++){const a=X+i*w/2,b=a+w/2,m=a+w/4;
c.fillStyle=lit;c.beginPath();c.moveTo(a,ht);c.lineTo(m,ht+sd);c.lineTo(m,ht);c.closePath();c.fill();c.fillStyle=drk;c.beginPath();c.moveTo(m,ht);c.lineTo(m,ht+sd);c.lineTo(b,ht);c.closePath();c.fill();
c.fillStyle=lit;c.beginPath();c.moveTo(a,hb);c.lineTo(m,hb-sd);c.lineTo(m,hb);c.closePath();c.fill();c.fillStyle=drk;c.beginPath();c.moveTo(m,hb);c.lineTo(m,hb-sd);c.lineTo(b,hb);c.closePath();c.fill()}
c.strokeStyle=lit;c.lineWidth=Math.max(1.5,U*.06);c.beginPath();c.moveTo(X,0);c.lineTo(X,ht);c.lineTo(X+w,ht);c.lineTo(X+w,0);c.moveTo(X,H);c.lineTo(X,hb);c.lineTo(X+w,hb);c.lineTo(X+w,H);c.stroke()}
for(const w of st.sw){const X=sx(w.x);if(X<-U*2||X>W+U*2)continue;const Y=sy(w.y+w.amp*Math.sin(w.sp*st.t+w.ph)),r=w.r*U;
c.strokeStyle='rgba(255,255,255,.07)';c.lineWidth=U*.1;c.beginPath();c.moveTo(X,sy(w.y-w.amp));c.lineTo(X,sy(w.y+w.amp));c.stroke();
c.save();c.translate(X,Y);c.rotate(st.t*9);c.beginPath();for(let i=0;i<16;i++){const a=i/16*6.283,rr=i%2?r*.68:r*1.15;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.closePath();c.fillStyle=lit;c.fill();c.strokeStyle='#fff';c.lineWidth=Math.max(1,U*.03);c.stroke();c.fillStyle=drk;c.beginPath();c.arc(0,0,r*.4,0,7);c.fill();c.restore()}
for(const p of st.pt){const X=sx(p.x);if(X<-U||X>W+U)continue;const col={f:'#ffaa33',s:'#66ccff',n:'#cfd8ff',m:'#66ff66',b:'#dd99ff'}[p.k];
c.globalAlpha=.16;c.fillStyle=col;c.fillRect(X-U*.5,0,U,H);c.globalAlpha=1;c.strokeStyle=col;c.lineWidth=Math.max(2,U*.09);c.beginPath();c.moveTo(X-U*.5,0);c.lineTo(X-U*.5,H);c.moveTo(X+U*.5,0);c.lineTo(X+U*.5,H);c.stroke();
c.lineWidth=Math.max(2,U*.1);c.lineCap='round';c.lineJoin='round';
for(let yy=1.2;yy<HH;yy+=2.4){const Y=sy(yy);c.beginPath();
if(p.k=='f'){const a=((st.t*2)%1-.5)*U*.5;c.moveTo(X+a-U*.2,Y-U*.3);c.lineTo(X+a+U*.1,Y);c.lineTo(X+a-U*.2,Y+U*.3)}
else if(p.k=='s'){const a=((st.t*2)%1-.5)*U*.5;c.moveTo(X-a+U*.2,Y-U*.3);c.lineTo(X-a-U*.1,Y);c.lineTo(X-a+U*.2,Y+U*.3)}
else if(p.k=='m'){c.rect(X-U*.12,Y-U*.12,U*.24,U*.24)}
else if(p.k=='b'){c.rect(X-U*.25,Y-U*.25,U*.5,U*.5)}
else{c.moveTo(X-U*.2,Y);c.lineTo(X+U*.2,Y)}c.stroke()}}}
function draw(){const L=st.L,h=L.hue!=null?L.hue:(200+st.dist*.12)%360,cam=st.x-W/U*.25,sx=x=>(x-cam)*U,sy=y=>y*U;
c.setTransform(1,0,0,1,0,0);if(shake>0)c.translate((rnd()-.5)*shake*U*.4,(rnd()-.5)*shake*U*.4);
c.fillStyle='hsl('+h+',55%,5%)';c.fillRect(-60,-60,W+120,H+120);
c.strokeStyle='hsla('+h+',80%,60%,.08)';c.lineWidth=1;const gs=U*2,go=((cam*U*.4)%gs+gs)%gs;c.beginPath();for(let x=-go;x<W;x+=gs){c.moveTo(x,0);c.lineTo(x,H)}for(let y=0;y<H;y+=gs){c.moveTo(0,y);c.lineTo(W,y)}c.stroke();
walls(h,cam,sx,sy);
for(const o of st.obs){const X=sx(o.x),Yy=sy(o.y),r=o.r*U;if(X<-r||X>W+r)continue;
c.fillStyle='hsl('+(h+170)%360+',100%,64%)';c.beginPath();c.moveTo(X-r,Yy);c.lineTo(X,Yy-r);c.lineTo(X,Yy+r);c.closePath();c.fill();
c.fillStyle='hsl('+(h+170)%360+',90%,34%)';c.beginPath();c.moveTo(X+r,Yy);c.lineTo(X,Yy-r);c.lineTo(X,Yy+r);c.closePath();c.fill();
c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=Math.max(1,U*.03);c.beginPath();c.moveTo(X-r,Yy);c.lineTo(X,Yy-r);c.lineTo(X+r,Yy);c.lineTo(X,Yy+r);c.closePath();c.stroke()}
drawExtras(h,cam,sx,sy);
if(mode=='menu'){c.setTransform(1,0,0,1,0,0);return}
const tr=st.trail,col=S.hue;
if(tr.length>=2){c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(sx(tr[0]),sy(tr[1]));for(let i=2;i<tr.length;i+=2)c.lineTo(sx(tr[i]),sy(tr[i+1]));if(!st.dead)c.lineTo(sx(st.x),sy(st.y));
c.strokeStyle='hsla('+col+',100%,60%,.3)';c.lineWidth=U*.3*st.sc;c.stroke();c.strokeStyle='hsl('+col+',100%,65%)';c.lineWidth=U*.14*st.sc;c.stroke();c.strokeStyle='#fff';c.lineWidth=U*.04*st.sc;c.stroke()}
if(!st.dead)drawArrow(c,sx(st.x),sy(st.y),hold?-Math.PI/4:Math.PI/4,S.skin,col,U*st.sc);
for(const p of parts){c.fillStyle='hsla('+col+',100%,70%,'+Math.max(0,p.l)+')';c.fillRect(sx(p.x),sy(p.y),U*.18,U*.18)}
c.setTransform(1,0,0,1,0,0);c.fillStyle='#fff';c.textAlign='left';
if(L===UN){const cu=Math.floor(st.dist),nb=cu>S.best&&S.best>0;c.font='800 '+(U*.8)+'px system-ui,sans-serif';c.fillText(cu+' m',U*.6,U*1.2);c.font='600 '+(U*.36)+'px system-ui,sans-serif';c.fillStyle=nb?'#fd4':'rgba(255,255,255,.75)';c.fillText(nb?'NEW HIGH SCORE!':'High score: '+Math.floor(S.best)+' m',U*.6,U*1.85)}
else{const pc=Math.min(1,st.x/L.len);c.fillStyle='rgba(0,0,0,.5)';c.fillRect(W*.25,U*.4,W*.5,U*.3);c.fillStyle='hsl('+h+',100%,65%)';c.fillRect(W*.25,U*.4,W*.5*pc,U*.3);c.fillStyle='#fff';c.textAlign='center';c.font='700 '+(U*.4)+'px system-ui,sans-serif';c.fillText(L.n+'  ·  '+(pc*100|0)+'%',W/2,U*1.25)}
c.textAlign='center';
if(st.cd>0){const sg=st.cdT/3,n=Math.ceil(st.cd/sg),r=st.cd/sg-(n-1);c.globalAlpha=.3+.7*r;c.fillStyle='#fff';c.font='900 '+(U*(2.6+r*1.2))+'px system-ui,sans-serif';c.fillText(n,W/2,H*.42);c.globalAlpha=r*.5;c.strokeStyle='#5ff';c.lineWidth=U*.08;c.beginPath();c.arc(W/2,H*.42-U*.9,U*(1.8+(1-r)*1.4),0,7);c.stroke();c.globalAlpha=1;c.font='600 '+(U*.4)+'px system-ui,sans-serif';c.fillStyle='rgba(255,255,255,.8)';c.fillText('Hold to climb · release to dive',W/2,H*.82)}
else if(st.go>0){c.globalAlpha=Math.min(1,st.go*2);c.fillStyle='#5f8';c.font='900 '+(U*2.4)+'px system-ui,sans-serif';c.fillText('GO!',W/2,H*.42);c.globalAlpha=1}
if(st.dead){c.fillStyle='#fff';c.font='800 '+(U*.9)+'px system-ui,sans-serif';c.fillText('CRASHED',W/2,H*.4);c.font='600 '+(U*.45)+'px system-ui,sans-serif';c.fillText(L===UN?Math.floor(st.dist)+' m':(Math.min(99,st.x/L.len*100|0))+'%',W/2,H*.4+U*.8)}
if(flash>0){c.fillStyle='rgba(255,60,120,'+flash*.5+')';c.fillRect(0,0,W,H)}}
function begin(i,quick){cur=i;const L=i<0?UN:LV[i];st=newState(L);st.cd=quick?1.5:3;st.cdT=st.cd;parts=[];hold=false;acc=0;mode='play';if(!quick){att=0;t0=performance.now()}att++;ext();show(null);$('wpause').classList.remove('wh')}
function ambient(){st=newState(UN);st.x=rnd()*500;st.kb=0;mode='menu';ext();$('wpause').classList.add('wh')}
function show(id){for(const k of ['wm','wl','wsd','wwin'])$(k).classList.toggle('wh',k!=id);if(id=='wm'||id=='wl'){ui()}}
function toMenu(id){if(mode=='play'){ambient()}show(id||'wm')}
function ui(){$('wbest').textContent='High score: '+Math.floor(S.best)+' m';
const g=$('wlg');g.innerHTML='';LV.forEach((l,i)=>{const b=document.createElement('button'),lk=i>=S.prog;b.className=lk?'lk':'';b.style.borderColor='hsl('+l.hue+',90%,60%)';b.innerHTML=(lk?'<b>🔒</b>':'<b>'+(i+1)+'</b>')+l.n+'<div class="bar"><i style="width:'+S.lv[i]+'%"></i></div><small>'+(lk?'Locked':S.lv[i]+'%')+'</small>';b.onclick=()=>{if(!lk)begin(i)};g.appendChild(b)});
const sg=$('wsg');sg.innerHTML='';SK.forEach((_,k)=>{const b=document.createElement('button'),cc=document.createElement('canvas');cc.width=cc.height=56;b.className=k==S.skin?'sel':'';b.appendChild(cc);drawArrow(cc.getContext('2d'),28,28,-Math.PI/4,k,S.hue,30);b.onclick=()=>{S.skin=k;save();ui();prev()};sg.appendChild(b)});prev()}
function prev(){const p=$('wpv').getContext('2d');p.clearRect(0,0,220,120);const ex=150,ey=44;p.lineCap='round';p.lineJoin='round';
p.beginPath();p.moveTo(14,100);p.lineTo(ex-56,100);p.lineTo(ex,ey);
p.strokeStyle='hsla('+S.hue+',100%,60%,.3)';p.lineWidth=15;p.stroke();p.strokeStyle='hsl('+S.hue+',100%,65%)';p.lineWidth=7;p.stroke();p.strokeStyle='#fff';p.lineWidth=2.5;p.stroke();
drawArrow(p,ex,ey,-Math.PI/4,S.skin,S.hue,52)}
function loop(n){if(!on)return;raf=requestAnimationFrame(loop);const d=Math.min(.05,(n-last)/1000);last=n;t+=d;shake=Math.max(0,shake-d);flash=Math.max(0,flash-d*2);
if(mode=='menu'){st.t+=d;st.x+=6*d;st.dist=st.x;ext();trim()}
else{if(st.go>0)st.go-=d;
if(st.cd>0){st.cd-=d;if(st.cd<=0){st.go=.6;acc=0}}
else if(!st.dead&&!st.won){acc+=d;while(acc>=1/120&&!st.dead&&!st.won){step(1/120);acc-=1/120}}
for(const p of parts){p.x+=p.vx*d;p.y+=p.vy*d;p.l-=d*1.2}
if(st.dead){st.dead-=d;if(st.dead<=0)begin(cur,true)}}
draw()}
function open(){wv.style.display='block';on=true;window.waveOn=true;hold=false;resize();ambient();show('wm');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function close(){on=false;window.waveOn=false;hold=false;cancelAnimationFrame(raf);wv.style.display='none'}
const jk=e=>e.code=='Space'||e.code=='ArrowUp'||e.code=='KeyW';
addEventListener('keydown',e=>{if(!on)return;e.stopImmediatePropagation();if(jk(e)){hold=true;e.preventDefault()}
else if(e.code=='Escape'){if(mode=='play')toMenu('wm');else if(!$('wm').classList.contains('wh'))close();else show('wm')}},true);
addEventListener('keyup',e=>{if(!on)return;e.stopImmediatePropagation();if(jk(e))hold=false},true);

addEventListener('resize',()=>{if(on)resize()});
$('wvb').onclick=open;$('wback').onclick=close;$('wlv').onclick=()=>show('wl');$('wun').onclick=()=>begin(-1);$('wsk').onclick=()=>{show('wsd')};
document.querySelectorAll('#wave .wbk').forEach(b=>b.onclick=()=>show('wm'));
$('whu').value=S.hue;$('whu').oninput=e=>{S.hue=+e.target.value;save();ui()};
$('wpause').onclick=()=>toMenu('wm');$('wlv2').onclick=()=>{ambient();show('wl')};$('wnx').onclick=()=>begin(cur+1);$('wrp').onclick=()=>begin(cur);
ui();
